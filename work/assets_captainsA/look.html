<!doctype html>
<html><head><meta charset="utf-8"><title>captain look</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>body{margin:0;background:#9fb4c0}canvas{display:block}</style></head>
<body><script type="module">
// Loads each captain THROUGH THE GAME'S assetlib with keepHierarchy (the real path), then renders:
// face close-up, three-quarter rest, posed three-quarter, posed side, posed back-three-quarter, far (25 m) view.
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const q = new URLSearchParams(location.search);
const srcs = q.get('src').split(',');
const S = +(q.get('size') || 300);
const COLS = 6;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S * COLS, S * srcs.length, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c0);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a5a48, 1.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4); sun.position.set(4, 8, 6); scene.add(sun);
const deck = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.05, 32), new THREE.MeshStandardMaterial({ color: 0xc89a62, roughness: 0.7 }));
deck.position.y = -0.025; scene.add(deck);
const out = { info: [] };
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
const H = 1.85;
function shot(col, row, pos, look, fov) {
  cam.fov = fov || 30; cam.updateProjectionMatrix();
  cam.position.set(...pos); cam.lookAt(...look);
  const y = (srcs.length - 1 - row) * S;
  renderer.setViewport(col * S, y, S, S); renderer.setScissor(col * S, y, S, S);
  renderer.render(scene, cam);
}
for (let row = 0; row < srcs.length; row++) {
  const url = srcs[row];
  const m = await ASSET(url, { keepHierarchy: true });
  scene.add(m);
  const j = m.userData.joints || {};
  const names = ['torso', 'head', 'hat', 'armL', 'armR', 'legL', 'legR', 'handL', 'handR'];
  const missing = names.filter((n) => !j[n] || !j[n].isObject3D);
  let tris = 0, meshes = 0; const mats = new Set();
  m.traverse((o) => { if (o.isMesh) { meshes++; mats.add(o.material); tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; } });
  const box = new THREE.Box3().setFromObject(m); const sz = box.getSize(new THREE.Vector3());
  const h = sz.y;
  // hand marker world position at rest vs palm
  m.updateMatrixWorld(true);
  const hr = j.handR ? j.handR.getWorldPosition(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3)) : null;
  const parts = []; m.traverse((o) => { if (o.isMesh) parts.push(o.parent.name + ':' + o.material.color.getHexString() + ':' + (o.geometry.attributes.position.count / 3)); });
  parts.sort((a, b) => +b.split(':')[2] - +a.split(':')[2]);
  out.info.push({ top: parts.slice(0, 8).join(' '), url, missing, tris, meshes, materials: mats.size, size: sz.toArray().map((v) => +v.toFixed(3)), handR: hr, userDataKeys: Object.keys(m.userData) });
  const c = h * 0.5;
  shot(0, row, [0, h * 0.86, 1.25 * h / H], [0, h * 0.86, 0], 30);
  shot(1, row, [2.6, 1.5, 4.3].map((v) => v * h / H), [0, c, 0]);
  // pose
  if (!missing.length) { j.armR.rotation.x = -1.2; j.torso.rotation.x = 0.3; j.legL.rotation.x = 0.5; j.hat.rotation.x = -0.4; j.hat.position.y += 0.0; }
  shot(2, row, [3.0, 1.6, 3.6].map((v) => v * h / H), [0, c, 0]);
  shot(3, row, [-5.0, 1.1, 0].map((v) => v * h / H), [0, c, 0]);
  shot(4, row, [-2.6, 1.8, -3.8].map((v) => v * h / H), [0, c, 0]);
  if (!missing.length) { j.armR.rotation.x = 0; j.torso.rotation.x = 0; j.legL.rotation.x = 0; j.hat.rotation.x = 0; }
  shot(5, row, [7, 5, 24], [0, c, 0], 9);
  scene.remove(m);
}
window.__out = out; window.__done = true;
</script></body></html>
